# Optional containerized run (ADR-001: the demo also runs with no containers).
# PostgreSQL is included for the future repository swap; the v0.1 API uses the
# file store and does not require it.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["8000:8000"]
    environment:
      VERINE_DATA_DIR: /data
    volumes: ["verine-data:/data"]

  web:
    build:
      context: apps/web
    ports: ["3000:3000"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    profiles: ["future"]
    environment:
      POSTGRES_DB: verine
      POSTGRES_USER: verine
      POSTGRES_PASSWORD: verine
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  verine-data:
